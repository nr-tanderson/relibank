name: ReliBank full app SRE scenarios

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Manually inject or recover a bounded service/database outage
        type: choice
        default: status
        options: [status, api-outage, api-recover, image-pull-failure, image-rollback, database-outage, database-recover]
      target:
        description: Select one workload for the selected operation
        type: choice
        default: bill-pay-service
        options: [accounts-service, auth-service, bill-pay-service, transaction-service, accounts-db, mssql]
permissions:
  contents: read
  id-token: write
concurrency:
  group: relibank-full-app-lab
  cancel-in-progress: false
jobs:
  scenario:
    runs-on: ubuntu-latest
    environment: lab-application
    timeout-minutes: 20
    env:
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      OPERATION: ${{ inputs.operation }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.10
      - name: Run one manual scenario under the shared lock
        run: bash demo_lab/lab-lock.sh bash demo_lab/full-app-scenario.sh